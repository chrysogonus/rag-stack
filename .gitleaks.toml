# gitleaks' default rules, plus one exception.
[extend]
useDefault = true

# The eval's saved results key each answer and verdict by a sha256 of its inputs; the generic
# API-key rule takes those digests for keys. Only these four fields, only as 64 hex digits.
[[allowlists]]
description = "sha256 digests of eval inputs in results.json"
paths = ['''^evals/datasets/[^/]+/results\.json$''']
regexTarget = "line"
regexes = ['''^\s*"(answer|judge|baseline|baseline_judge)_key": "[0-9a-f]{64}",?$''']
condition = "AND"
