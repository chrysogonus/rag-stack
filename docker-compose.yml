services:
  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Conversations, via the LangGraph checkpointer. Local dev credentials only.
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rag", "-d", "rag"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  qdrant_data:
  postgres_data:
