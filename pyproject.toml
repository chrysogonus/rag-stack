[project]
name = "rag-stack"
version = "0.1.0"
description = "RAG chatbot with a knowledge base agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    # Shielding the save of a stopped answer from the disconnect that cancels the stream.
    "anyio>=4.15.1",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "lxml>=6.1.3",
    "openai>=3.37.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pypdf>=6.21.2",
    "pyyaml>=6.0.3",
    # At most one minor version from the Qdrant server in docker-compose.yml (v1.15).
    "qdrant-client>=1.16.2,<1.17",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pyright",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["tests"]
markers = [
    "ai: evals against a real LLM (needs provider API keys)",
    "e2e: full chatbot path against real services (docker compose up -d) and a real LLM",
]
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"langchain_openai".msg = "Provider SDKs live only in rag_stack.llm; use its interfaces."
"openai".msg = "Provider SDKs live only in rag_stack.llm; use create_chat_model."
"anthropic".msg = "Provider SDKs live only in rag_stack.llm; use create_chat_model."
"fastembed".msg = "Model runtimes live only in rag_stack.llm; use its embedding interfaces."

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["tests"]

[tool.uv]
# fastembed caps pillow below 13, whose releases fix CVEs; we only use its text models.
override-dependencies = ["pillow>=13"]
